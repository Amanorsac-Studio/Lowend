name: Preset submission
description: Send us presets you made in Low End.
title: "[Preset] "
labels: ["beta", "preset"]
body:
  - type: markdown
    attributes:
      value: |
        In Low End, open **Library › Make a pack**, choose the presets and add your name as the author if you want it credited.
        The pack is saved as one `.lepack` file in `Documents/Amanorsac Studio/Low End/Packs/`. Attach it below.
  - type: input
    id: credit
    attributes:
      label: Credit
      description: The name to credit if a preset is used. Leave empty to stay anonymous.
  - type: textarea
    id: presets
    attributes:
      label: Preset pack
      description: Drag the .lepack file here (older .rig.json files are fine too).
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What they are for
      description: The song, style or bass each preset is made for, and anything we should know.
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: Amanorsac Studio may include these presets, with my credit if I gave one, in a future version of Low End.
          required: true
